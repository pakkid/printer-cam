# go2rtc configuration for the Creality K2 / K2 Plus built-in camera.
#
# Everything you are likely to change is an environment variable, resolved by
# go2rtc at startup from the container's environment. Set them in .env (local)
# or in the stack's Environment variables (Portainer) -- you should not need to
# edit this file to point at a different printer.
#
# ${VAR:default} is go2rtc's own substitution syntax, not Docker's.

log:
  # NOT templated on purpose. go2rtc registers every substituted value as a
  # "secret" and redacts it from log output, and its redacting writer returns a
  # short byte count, so any log line containing the value is dropped with
  # "zerolog: could not write event". For the log *level* that string appears
  # in every single line, which loses the entire log. LOG_LEVEL is applied by
  # docker-compose.yml instead, which substitutes before the container starts.
  level: info

streams:
  # The K2's firmware still runs its `webrtc_local` signalling service on
  # port 8000 even though Creality removed the viewer page that used it.
  #
  # `#format=creality` tells go2rtc to work around the firmware quirk where
  # the printer sends RTP with a payload type it never declares in its SDP
  # answer, which is why generic WebRTC clients connect but never render a
  # frame. Requires go2rtc >= 1.9.10.
  #
  # The stream is H.264 and is only ever re-muxed, never re-encoded, so CPU
  # usage stays at ~0%.
  printer: webrtc:http://${PRINTER_IP:192.168.1.17}:8000/call/webrtc_local#format=creality

api:
  listen: ":1984"

  # Serve our own viewer instead of go2rtc's bundled web UI. As a side effect
  # the bundled config/stream editor pages are not present at all.
  static_dir: /app/www

  # Leave AUTH_USER unset to disable basic auth entirely (no middleware is
  # installed at all in that case). A password that IS set gets redacted from
  # the logs, which here is the substitution behaviour working as intended.
  username: ${AUTH_USER:}
  password: ${AUTH_PASS:}

  # local_auth: true enforces basic auth for 127.0.0.1 as well.
  # This matters: go2rtc's default exempts loopback, and a tunnel client
  # running on the same host and pointed at http://127.0.0.1:1984 would then
  # silently bypass the password for the whole internet. Browsers reaching you
  # through the tunnel still authenticate normally, because the tunnel
  # forwards their Authorization header.
  local_auth: true

  # HARD security boundary: only these HTTP paths get registered. Everything
  # else returns 404 whether or not a request is authenticated.
  #
  # Deliberately absent: /api/streams (lets a caller define new streams by
  # URL), /api/config, /api/exit, /api/log. Those are what make an
  # internet-exposed go2rtc dangerous. This printer only needs watching.
  allow_paths:
    - /                 # the viewer in /app/www
    - /api/ws           # MSE + fMP4 (and WebRTC signalling) over WebSocket
    - /api/stream.mp4   # plain fMP4 over HTTP - VLC, ffmpeg, <video src>
    - /api/frame.jpeg   # JPEG snapshot (see README: this one does cost CPU)
    - /api/restart      # see below -- this one is NOT publicly reachable

  # /api/restart is here for one reason: it is the only way to sever an
  # established WebRTC session. WebRTC media flows browser <-> go2rtc:8555
  # directly and never passes through the front door, and the signalling
  # WebSocket is already closed by then, so nothing upstream has a connection
  # left to drop. When the camera switch is turned off, the front door POSTs
  # here and go2rtc re-execs itself, which drops every peer connection at once.
  #
  # It is not exposed: go2rtc's HTTP port is not published to the host, and the
  # front door explicitly denies /api/restart on the public listener (see
  # web/nginx.conf), so the only caller that can reach it is the front door
  # container itself.

webrtc:
  # go2rtc listens on :8555 (tcp+udp) by default, which is what the viewer
  # prefers because it is genuinely real-time. It also needs a candidate the
  # browser can actually route to: in bridge networking go2rtc only knows its
  # own 172.x address, so set WEBRTC_CANDIDATE=<docker-host-lan-ip>:8555.
  # An empty value is harmless -- viewers just use the MSE fallback.
  candidates:
    - ${WEBRTC_CANDIDATE:}
