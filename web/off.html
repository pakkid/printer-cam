<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Camera Off</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  html, body { height: 100%; margin: 0; background: #000; color: #f2efe9; }
  body { display: grid; place-items: center;
         font-family: "IBM Plex Mono", ui-monospace, monospace; }
  div { border: 1px solid #f2efe9; padding: 20px 26px; text-align: center; }
  h1 { margin: 0; font-family: "Bodoni Moda", "Times New Roman", serif;
       font-size: 19px; font-weight: 400; letter-spacing: .02em; }
  p { margin: 8px 0 0; font-size: 11px; letter-spacing: .14em;
      text-transform: uppercase; color: rgba(242,239,233,.56); }
</style>
</head>
<body>
  <div>
    <h1>The camera is switched off</h1>
    <p>Switched off on the local network</p>
  </div>
</body>
</html>
