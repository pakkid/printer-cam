# A bare WebRTC endpoint for the LAN, with no UI on it.
#
# Its only job is to be the `stream_url` of a Fluidd webcam. Fluidd's
# webrtc-go2rtc service takes that URL, derives `api/ws` + the query string
# from it, and speaks go2rtc's own WebSocket protocol. So this exposes exactly
# that one path, plus the JPEG snapshot for Fluidd's thumbnail. Nothing else --
# no viewer, no print data.
#
#   stream_url:   http://<docker-host>:1986/?src=printer
#   snapshot_url: http://<docker-host>:1986/api/frame.jpeg?src=printer
#
# Deliberately NOT gated by the camera switch: the switch takes the camera off
# the internet, and this listener is not on the internet. It keeps working
# while the public port refuses everything.
#
# Do not forward this port through your tunnel. If you do, the switch stops
# meaning anything.
#
# WebRTC works here because a LAN browser can reach go2rtc's media port (8555)
# directly. That is the same reason remote viewers cannot use WebRTC and fall
# back to MSE.

server {
    listen 82;
    server_name _;

    add_header Cache-Control "no-store" always;

    # Same posture as the switch port: private ranges by default, since whether
    # nginx sees the true client address depends on how Docker publishes the
    # port. Narrow it with LAN_ALLOW if you want.
    include /etc/nginx/lan-allow.conf;

    # Signalling. Fluidd opens this; the media then flows browser <-> 8555.
    location = /api/ws {
        proxy_pass http://printer-cam:1984;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;

        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Optional, for Fluidd's snapshot_url. Costs real CPU per call, so do not
    # let anything poll it hard -- see the README.
    location = /api/frame.jpeg {
        limit_except GET { deny all; }
        proxy_pass http://printer-cam:1984;
        proxy_read_timeout 20s;
    }

    # A hint for whoever opens this port in a browser expecting a picture.
    location = / {
        default_type text/plain;
        return 200 "printer-cam: WebRTC endpoint for Fluidd, no UI here.\nUse this as a Fluidd webcam stream_url, with ?src=printer\nThe viewer lives on the public port.\n";
    }

    location / { return 404; }
}
