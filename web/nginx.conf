# Single front door. The video path is a plain pass-through to go2rtc, which is
# no longer published to the host at all -- so its API is only reachable from
# inside the compose network, and only through the paths below.

server {
    listen 80;
    server_name _;

    # Nothing here is worth caching, and stale print progress is worse than none.
    add_header Cache-Control "no-store" always;


    # The sanitised print-progress endpoint. Read-only, and the only thing that
    # ever talks to Moonraker. See web/print_status.py.
    location = /print {
        limit_except GET { deny all; }
        include /etc/nginx/auth.conf;
        proxy_pass http://127.0.0.1:8099/print;
        proxy_read_timeout 10s;
    }

    # Everything else is go2rtc: the viewer, and /api/ws for the stream.
    location / {
        include /etc/nginx/auth.conf;

        # A literal hostname, resolved once at startup through the normal
        # resolver stack. The entrypoint waits for it to resolve before
        # starting nginx (which otherwise refuses to boot) and reloads if the
        # address later changes. Deliberately not nginx's `resolver` with the
        # host in a variable: that form ignores /etc/hosts, which makes the
        # container untestable outside a working Docker DNS.
        proxy_pass http://printer-cam:1984;
        proxy_http_version 1.1;

        # Required for /api/ws -- both MSE and WebRTC signalling ride this.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A live stream must not be buffered, and must not time out.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
