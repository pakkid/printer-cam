# The viewer, on the port your tunnel points at. Everything here is gated by
# gate.conf, which the switch rewrites -- see admin.conf and print_status.py.
# The video path is a plain pass-through to go2rtc, which is not published to
# the host at all, so its API is reachable only from inside this network.

server {
    listen 80;
    server_name _;

    add_header Cache-Control "no-store" always;

    # gate.conf is empty while the camera is on, and `return 503;` once the
    # switch is off. It is included per-location on purpose: at server level
    # the return also catches the internal redirect to the off page below,
    # which nginx sees as a redirection cycle and answers with its own bare
    # 503 instead.
    error_page 503 /_off.html;
    location = /_off.html {
        internal;                    # only reachable via the error_page above
        root /opt/pages;
        add_header Cache-Control "no-store" always;
    }

    # go2rtc accepts a restart, which is how the camera switch severs WebRTC
    # sessions. It must never be reachable from outside this container, and
    # `location /` below would otherwise proxy it straight through.
    location = /api/restart { deny all; }

    # The sanitised print-progress endpoint. Read-only, and the only thing that
    # ever talks to Moonraker. See web/print_status.py.
    location = /print {
        include /etc/nginx/gate.conf;
        limit_except GET { deny all; }
        include /etc/nginx/auth.conf;
        proxy_pass http://127.0.0.1:8099/print;
        proxy_read_timeout 10s;
    }

    # Everything else is go2rtc: the viewer, and /api/ws for the stream.
    location / {
        include /etc/nginx/gate.conf;
        include /etc/nginx/auth.conf;

        # A literal hostname, resolved once at startup through the normal
        # resolver stack. The entrypoint waits for it to resolve before
        # starting nginx (which otherwise refuses to boot) and reloads if the
        # address later changes. Deliberately not nginx's `resolver` with the
        # host in a variable: that form ignores /etc/hosts, which makes the
        # container untestable outside a working Docker DNS.
        proxy_pass http://printer-cam:1984;
        proxy_http_version 1.1;

        # Required for /api/ws -- both MSE and WebRTC signalling ride this.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A live stream must not be buffered, and must not time out.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
