# The switch, on a port of its own.
#
# This is the whole reason it is a separate server rather than a path on the
# viewer: your tunnel forwards one port, and it is not this one, so the switch
# has no route in from outside. An IP allowlist alone would not achieve that --
# a tunnel running as a container on this network has a private source address
# too, indistinguishable from a machine on your LAN.
#
# Note there is no `include gate.conf` here: the switch has to stay reachable
# while the camera is off, or you could not turn it back on.

server {
    listen 81;
    server_name _;

    add_header Cache-Control "no-store" always;

    # Defence in depth behind the separate port. Generated by the entrypoint
    # from ADMIN_ALLOW.
    include /etc/nginx/admin-allow.conf;

    # Optional password on top, from ADMIN_PASS.
    include /etc/nginx/admin-auth.conf;

    location = / {
        root /opt/pages;
        try_files /admin.html =404;
    }

    location = /state {
        proxy_pass http://127.0.0.1:8099/state;
        proxy_read_timeout 15s;
    }

    location / { return 404; }
}
