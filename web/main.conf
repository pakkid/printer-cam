# Main-context settings. /etc/nginx/conf.d/*.conf is included above events{} in
# the distribution config, which is the only place these are legal.

# On reload, nginx normally keeps old workers alive until their connections
# close -- and a video stream never closes. Without this, flipping the switch
# off would leave anyone already watching connected indefinitely, which defeats
# the point. Three seconds, then the old workers are terminated.
worker_shutdown_timeout 3s;
