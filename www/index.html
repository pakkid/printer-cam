<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Printer Camera</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='2' y='4' width='12' height='9' fill='none' stroke='%23fff' stroke-width='1.5'/></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* A single committed look: paper-white ink on absolute black, hairline
     rules, right angles only. No radii, no blur, no shadows, no gradients --
     the panels are opaque so they read over any frame. One serif for the
     wordmark, one monospace for everything measured. */
  :root {
    --ground: #000;
    --ink:    #f2efe9;          /* warm paper white, not clinical #fff */
    --dim:    rgba(242, 239, 233, .56);
    --rule:   rgba(242, 239, 233, .38);
    --alarm:  #c8402f;          /* the only colour, and only for faults */

    --serif: "Bodoni Moda", "Times New Roman", Times, serif;
    --mono:  "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.4;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- video ---------- */
  #stage {
    position: fixed; inset: 0; background: var(--ground);
    display: flex; align-items: center; justify-content: center;
  }
  /* #frame is sized in JS to the largest box of the stream's true aspect that
     fits the viewport; the video then fills it exactly. See the aspect note in
     the script for why object-fit: contain cannot be trusted here. */
  #frame { position: relative; }
  printer-cam { display: block; width: 100%; height: 100%; }
  printer-cam video {
    display: block; width: 100%; height: 100%;
    object-fit: fill; background: var(--ground);
    filter: brightness(1);
    transition: filter .3s linear;
  }
  body.busy printer-cam video { filter: brightness(.28) grayscale(.4); }

  /* ---------- status card ---------- */
  #scrim {
    position: fixed; inset: 0; z-index: 3;
    display: grid; place-items: center;
    background: rgba(0, 0, 0, .58);
    opacity: 0; visibility: hidden;
    transition: opacity .25s linear, visibility .25s;
  }
  #scrim.show { opacity: 1; visibility: visible; }

  #card {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 16px 20px 17px;
    background: var(--ground);
    border: 1px solid var(--ink);
    max-width: min(30rem, calc(100vw - 32px));
  }
  #card.error { border-color: var(--alarm); }

  /* A blinking block rather than a spinner: mechanical, and it costs one
     keyframe. step-end so it snaps instead of pulsing. */
  #spinner {
    width: 9px; height: 9px; flex: none; margin-top: 4px;
    background: var(--ink);
    animation: blink 1s step-end infinite;
  }
  #card.error #spinner { background: var(--alarm); animation-duration: .5s; }
  @keyframes blink { 50% { opacity: 0; } }

  #msg {
    margin: 0;
    font-family: var(--serif);
    font-size: 17px; font-weight: 400;
    letter-spacing: .01em;
  }
  #card.error #msg { color: var(--alarm); }
  #detail {
    margin: 7px 0 0;
    font-size: 11px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--dim);
  }
  #detail code { font: inherit; color: var(--ink); }

  /* ---------- chrome ---------- */
  .chrome {
    position: fixed; z-index: 4;
    opacity: 1;
    transition: opacity .2s linear;
    pointer-events: none;
  }
  .chrome > * { pointer-events: auto; }
  body.idle .chrome { opacity: 0; }

  /* Only ever shown when the transport has degraded to MSE. In the healthy
     case nothing appears -- there is deliberately no "live" badge. */
  #degraded {
    left: 16px; top: 16px;
    max-width: 34ch;
    padding: 8px 10px;
    background: var(--ground);
    border: 1px solid var(--rule);
    border-left: 2px solid var(--alarm);
    font-size: 11px; line-height: 1.45;
    letter-spacing: .01em;
  }
  #degraded b {
    display: block;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--alarm);
  }
  #degraded span { color: var(--dim); }
  /* while the scrim is up the notice would sit on top of it; the scrim's own
     message is the one that matters then */
  body.busy #degraded { display: none; }

  #toolbar {
    right: 16px; bottom: 16px;
    display: flex; gap: -1px;
    transition: bottom .2s linear;
  }
  body.printing #toolbar { bottom: 74px; }
  button {
    width: 38px; height: 38px; padding: 0;
    display: grid; place-items: center;
    background: var(--ground);
    border: 1px solid var(--rule);
    color: var(--ink);
    cursor: pointer;
    margin-left: -1px;             /* shared hairlines, like a fascia */
    transition: background .12s linear, color .12s linear;
  }
  button:first-child { margin-left: 0; }
  button:hover, button:focus-visible {
    background: var(--ink); color: var(--ground);
    border-color: var(--ink);
    outline: none;
  }
  button svg {
    width: 17px; height: 17px; fill: none; stroke: currentColor;
    stroke-width: 1.4; stroke-linecap: butt; stroke-linejoin: miter;
  }

  /* ---------- print readout ---------- */
  /* A full-width band, not a floating card: it belongs to the frame edge. */
  #print {
    left: 0; right: 0; bottom: 0;
    opacity: 0;
    transition: opacity .25s linear;
  }
  #print.show { opacity: 1; }
  #print[hidden] { display: none; }

  #print-inner {
    background: var(--ground);
    border-top: 1px solid var(--rule);
  }

  #print-row { display: flex; align-items: stretch; }
  .cell {
    display: flex; flex-direction: column; gap: 3px;
    padding: 9px 14px 10px;
    border-left: 1px solid var(--rule);
    min-width: 0;
  }
  .cell:first-child { border-left: 0; }
  .cell em {
    font-style: normal; font-size: 9.5px;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--dim);
  }
  .cell b {
    font-weight: 500; font-size: 13px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* Modifiers below deliberately match the base `.cell` specificity and rely
     on order. Keep the base selectors id-free or these stop applying. */
  /* the percentage carries the weight, set in the serif at display size */
  .cell--pct { flex: none; align-items: baseline; flex-direction: row; gap: 8px; }
  .cell--pct b {
    font-family: var(--serif);
    font-size: 26px; font-weight: 600; line-height: 1;
  }
  /* the sign set apart from the figure: Bodoni's percent glyph is too busy
     next to a 26px numeral, and this keeps the figure doing the work */
  .cell--pct u {
    text-decoration: none;
    font-size: 11px; color: var(--dim);
    margin-left: -3px;
  }
  .cell--pct i {
    font-style: normal; font-size: 9.5px;
    letter-spacing: .16em; text-transform: uppercase; color: var(--alarm);
  }
  .cell--fil b { display: flex; align-items: center; gap: 7px; }
  .cell--spring { flex: 1; border-left: 1px solid var(--rule); }

  /* a square, ringed so white and black filament both read */
  #print-swatch {
    width: 10px; height: 10px; flex: none; display: none;
    border: 1px solid var(--ink);
  }
  #print-swatch.show { display: block; }

  /* the progress rule: square ends, linear motion, no easing flourish */
  #print-track {
    height: 5px;
    border-top: 1px solid var(--rule);
    background: var(--ground);
  }
  #print-fill {
    height: 100%; width: 0%;
    background: var(--ink);
    /* deliberately no width transition: paintFascia() eases this itself, once
       per frame, and a CSS transition restarted every frame would only lag */
  }
  #print-inner.paused #print-fill {
    /* hatched rather than solid, so a hold is legible at a glance */
    background: repeating-linear-gradient(90deg,
      var(--dim) 0 4px, transparent 4px 8px);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }
  @media (max-width: 40rem) {
    #print-row { flex-wrap: wrap; }
    .cell { padding: 7px 11px 8px; }
    .cell--pct b { font-size: 20px; }
    .cell--spring { display: none; }
    body.printing #toolbar { bottom: 108px; }
  }
</style>
</head>
<body class="busy">

<div id="stage"><div id="frame"><printer-cam id="cam"></printer-cam></div></div>

<div id="scrim" class="show">
  <div id="card">
    <span id="spinner"></span>
    <div>
      <p id="msg">Connecting to the printer</p>
      <p id="detail">stream <code id="d-src"></code> / transport <code id="d-mode"></code></p>
    </div>
  </div>
</div>

<div class="chrome" id="degraded" hidden>
  <b>MSE fallback</b>
  <span>WebRTC could not be reached. On this transport a damaged frame stops
  the decoder outright, and the motion stutters. Publish UDP+TCP 8555 and set
  <code>WEBRTC_CANDIDATE</code>.</span>
</div>

<div class="chrome" id="print" hidden>
  <div id="print-inner">
    <div id="print-row">
      <span class="cell cell--pct"><b id="print-pct">0</b><u>%</u><i id="print-state"></i></span>
      <span class="cell cell--fil">
        <em>Filament</em>
        <b><span id="print-swatch"></span><span id="print-fil-type">&mdash;</span></b>
      </span>
      <span class="cell"><em>Elapsed</em><b id="print-elapsed">&mdash;</b></span>
      <span class="cell"><em>Used</em><b id="print-fil">&mdash;</b></span>
      <span class="cell cell--spring"></span>
    </div>
    <div id="print-track"><div id="print-fill"></div></div>
  </div>
</div>

<div class="chrome" id="toolbar">
  <button id="btn-snap" title="Save a snapshot" aria-label="Save a snapshot">
    <svg viewBox="0 0 24 24"><path d="M3 7h4l1.5-2h7L17 7h4v12H3z"/><circle cx="12" cy="13" r="3.6"/></svg>
  </button>
  <button id="btn-full" title="Fullscreen" aria-label="Fullscreen">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button id="btn-reload" title="Reconnect" aria-label="Reconnect">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 0-3 6.2"/><path d="M20 4v8h-8"/></svg>
  </button>
</div>

<script type="module">
import { VideoRTC } from './video-rtc.js';

const params = new URLSearchParams(location.search);
const src = params.get('src') || 'printer';

// Transport order. The player attempts WebRTC and MSE *in parallel* and
// prefers WebRTC once it delivers a frame, so this list costs nothing to a
// viewer that can only do one of them:
//
//   - WebRTC wins on the LAN. Genuinely real-time (no buffer) and it reports
//     the stream's true 1280x720, because it never goes through the fMP4
//     muxer that loses the SPS. Needs UDP/TCP 8555 reachable.
//   - MSE is the fallback that survives a plain HTTP(S) tunnel, being just a
//     WebSocket. See the onmse() override for the timestamp mess it has to
//     compensate for.
//   - mp4 is a last resort for browsers without MediaSource (older iOS
//     Safari). Note it is not really video: video-rtc.js implements it by
//     decoding into a canvas and setting the poster, i.e. a still-frame
//     slideshow.
//
// `mjpeg` is intentionally absent: it would re-encode every frame instead of
// passing H.264 through, which is the one thing here that costs real CPU.
const mode = params.get('mode') || 'webrtc,mse,mp4';

// True aspect ratio of the printer's stream (1280x720 on the K2 Plus).
//
// We cannot let the browser work this out. The printer's WebRTC signalling
// carries no sprop-parameter-sets, so go2rtc has no SPS when it builds the
// fMP4 init segment and falls back to a dummy 128x96 one. The real frames are
// 1280x720, but a browser on MSE takes its intrinsic size from that dummy
// track header and reports 1280x960, stretching the picture to 4:3. WebRTC
// reports the real size, and forcing a 16:9 box is a no-op for it, so the same
// correction is safe on both transports.
// Override with ?aspect=4/3 (or any w/h) if your camera differs.
const aspect = (() => {
  const raw = params.get('aspect') || '16/9';
  const [w, h] = raw.split('/').map(Number);
  return w > 0 && h > 0 ? w / h : 16 / 9;
})();

// Seconds of MSE buffer to retain, in *real* seconds. The printer's keyframe
// interval is ~1.04s, so a few seconds is plenty to always hold one.
const bufferSeconds = Math.max(2, Number(params.get('buffer')) || 6);

document.getElementById('d-src').textContent  = src;
const modeEl = document.getElementById('d-mode');
modeEl.textContent = mode;

const scrim = document.getElementById('scrim');
const card  = document.getElementById('card');
const msgEl = document.getElementById('msg');

const degradedEl = document.getElementById('degraded');

// Pending "connecting" report, deferred during a fast MSE recovery.
// See reportConnecting() and PrinterCam.onDecodeFault().
let graceTID = 0;

/**
 * Which transport won matters more than it looks. The printer streams over its
 * own wifi and loses ~0.7% of RTP packets in bursts, and it advertises `nack`
 * without implementing it -- it never retransmits, so nothing downstream can
 * recover a lost packet.
 *
 * Neither transport hides that, and it is worth being precise about why: go2rtc
 * assembles access units without checking RTP sequence continuity and then
 * re-packetizes with fresh sequence numbers, so by the time either transport
 * sees the stream the evidence of loss is gone. Damaged frames simply arrive
 * looking whole. What differs is what the two do with them:
 *
 *   WebRTC  the decoder rejects frames it cannot decode (~7% here, which is
 *           what the freezes are) and renders the milder ones, which smear
 *           until the next keyframe. Degraded, but it keeps running.
 *   MSE     Chrome raises MEDIA_ERR_DECODE and the decoder stops outright --
 *           see onDecodeFault(). MSE also has to honour the printer's RTP
 *           timestamps, which are junk, so it stutters as well.
 *
 * MSE is therefore a fault worth naming, not a quiet fallback.
 *
 * @param {'live'|'connecting'|'error'} state
 */
function setState(state, transport) {
  clearTimeout(graceTID);
  graceTID = 0;
  const busy = state !== 'live';
  document.body.classList.toggle('busy', busy);
  scrim.classList.toggle('show', busy);
  card.classList.toggle('error', state === 'error');
  if (state === 'error')           msgEl.textContent = 'Stream error — retrying…';
  else if (state === 'connecting') msgEl.textContent = 'Connecting to the printer…';
  if (transport) {
    console.info('[printer-cam] transport:', transport);
    modeEl.textContent = transport;
    degradedEl.hidden = transport === 'WebRTC';
  }
}

/**
 * Report "connecting" now, or -- while recovering from a decode fault -- only
 * if the recovery has not finished within the grace period. Such a recovery
 * costs about one init segment, and flashing the whole scrim for that is more
 * distracting than the single corrupt frame that caused it.
 */
function reportConnecting(deferred) {
  if (!deferred) return setState('connecting');
  clearTimeout(graceTID);
  graceTID = setTimeout(() => setState('connecting'), 1500);
}

class PrinterCam extends VideoRTC {
  oninit() {
    super.oninit();
    this.video.controls = false;   // we draw our own chrome
    this.video.muted = true;       // video-only stream, but keeps autoplay happy

    // See the onmse() override below for why playbackRate is left alone here.

    this.fastRecoveries = 0;
    this.lastFaultTS = 0;
    this.recovering = false;
    this.mediaRatio = 0;      // see onmse(); survives MediaSource re-inits

    // Runs after video-rtc.js's own error listener, which has already called
    // ws.close(); onclose() has not run yet, so onDecodeFault() can still
    // change what it decides to do.
    this.video.addEventListener('error', () => {
      const err = this.video.error;
      if (err && err.code === 3) this.onDecodeFault();  // MEDIA_ERR_DECODE
    });
  }

  /**
   * A single corrupt frame must not cost fifteen seconds of black.
   *
   * The printer loses ~0.7% of its RTP packets in bursts on its wifi and never
   * retransmits, so damaged frames do reach the browser. On MSE they do not
   * merely smear: Chrome's decoder raises MEDIA_ERR_DECODE and stops.
   * video-rtc.js responds by closing the WebSocket, and its onclose() then
   * waits `RECONNECT_TIMEOUT - (now - connectTS)`. With a fault every ~8
   * seconds the stream is almost never up for the full 15, so that formula
   * charges nearly the entire 15s penalty for each one -- and the viewer sits
   * on "Connecting to the printer" more or less permanently. Measured here:
   * MSE could not hold a picture at all, while WebRTC ran clean beside it.
   *
   * There is nothing to back off from. The server is fine and the network is
   * fine; one frame was broken. Zeroing connectTS makes that delay compute to
   * zero, so the retry is immediate and costs one init segment.
   *
   * The rate limit is the honest part: if faults arrive faster than this can
   * absorb them, something worse than packet loss is wrong and upstream's
   * backoff should get its way.
   */
  onDecodeFault() {
    const now = Date.now();
    if (now - this.lastFaultTS > 10000) this.fastRecoveries = 0;
    this.lastFaultTS = now;
    if (++this.fastRecoveries > 8) return;  // give up; let the backoff run
    this.connectTS = 0;                     // => onclose() retries at once
    this.recovering = true;
  }

  /**
   * Replaces video-rtc.js's MSE handling. Same plumbing, different timing
   * policy, because this camera's timestamps are wrong and upstream's
   * assumptions break on them.
   *
   * The printer stamps its RTP timestamps as though it were encoding at about
   * 1.5 fps while actually sending ~14.6. go2rtc copies those timestamps
   * faithfully into the fMP4 it muxes, so the container claims 1.5 fps and the
   * media clock runs ~9.7x faster than wall time. A browser renders MSE frames
   * according to those timestamps, so it plays at ~1.5 fps -- the stream looks
   * like a slideshow.
   *
   * WebRTC is immune: it renders frames as they arrive and only uses
   * timestamps for jitter buffering, which is why the same feed is smooth
   * there. This only affects MSE (and anything else reading the muxed mp4).
   *
   * Upstream's controller cannot cope: it keeps a 5-media-second window, which
   * here is only ~0.5 real seconds, and drives `playbackRate = gap` toward 1.0
   * -- i.e. toward 1.5 fps. Its forward seeks into a window that thin then
   * stall the decoder outright.
   *
   * So: measure how fast media time actually advances relative to the wall
   * clock, and play at that rate. Frames then come out at ~14.6 fps. The
   * measurement is adaptive rather than a hardcoded 9.7, so this keeps working
   * if the printer or go2rtc is ever fixed (the ratio simply converges to 1).
   * There is no audio track, so a high playback rate has no pitch side effect.
   */
  onmse() {
    const TARGET = 0.6;   // real seconds behind live to aim for

    /**
     * Media seconds per wall second; 0 until measured.
     *
     * Seeded from the instance, not from zero. The ratio describes how wrong
     * the *printer's* timestamps are, which does not change when a decode
     * fault forces a new MediaSource -- so re-measuring it from scratch after
     * every fault is pure loss. It costs ~10s to re-converge, and on this
     * camera faults arrive every 5-8s, so a restarted controller never gets
     * there: playback crawls near 1.5 fps indefinitely. Carrying the
     * measurement over means a recovered stream resumes at full speed.
     */
    let ratio = this.mediaRatio || 0;
    let sampleWall = 0, sampleEnd = 0;
    let lastResync = 0;

    /** @type {MediaSource} */
    const Managed = 'ManagedMediaSource' in window;
    const MS = Managed ? window.ManagedMediaSource : window.MediaSource;
    const ms = new MS();

    ms.addEventListener('sourceopen', () => {
      if (!Managed) URL.revokeObjectURL(this.video.src);
      this.send({ type: 'mse', value: this.codecs(MS.isTypeSupported) });
    }, { once: true });

    if (Managed) {
      this.video.disableRemotePlayback = true;
      this.video.srcObject = ms;
    } else {
      this.video.src = URL.createObjectURL(ms);
      this.video.srcObject = null;
    }

    this.play();
    this.mseCodecs = '';

    this.onmessage['mse'] = msg => {
      if (msg.type !== 'mse') return;
      this.mseCodecs = msg.value;

      const sb = ms.addSourceBuffer(msg.value);
      sb.mode = 'segments';

      sb.addEventListener('updateend', () => {
        if (!sb.updating && bufLen > 0) {
          try {
            sb.appendBuffer(buf.slice(0, bufLen));
            bufLen = 0;
          } catch (e) { /* throws once the media source starts closing */ }
        }
        if (sb.updating || !sb.buffered || !sb.buffered.length) return;

        const v = this.video;
        const end = sb.buffered.end(sb.buffered.length - 1);
        const now = performance.now() / 1000;

        // --- how fast is media time really advancing? ---
        if (!sampleWall) {
          sampleWall = now; sampleEnd = end;
        } else if (now - sampleWall >= 0.4) {
          const inst = (end - sampleEnd) / (now - sampleWall);
          // Ignore nonsense (a stalled feed, or a discontinuity in the source)
          if (inst > 0.2 && inst < 40) {
            ratio = ratio ? ratio * 0.7 + inst * 0.3 : inst;
            this.mediaRatio = ratio;
          }
          sampleWall = now; sampleEnd = end;
        }
        if (!ratio) return;   // nothing sensible to do until we have a measurement

        // --- trim, in real-time terms ---
        const keep = end - bufferSeconds * ratio;
        const start0 = sb.buffered.start(0);
        // Only ever trim behind the playhead, so the keyframe the decoder is
        // working from is never removed underneath it.
        if (keep > start0 && keep < v.currentTime - ratio) {
          try {
            sb.remove(start0, keep);
            ms.setLiveSeekableRange(keep, end);
          } catch (e) { /* ignore; we retry on the next append */ }
        }

        // Only intervene if playback is stranded outside the buffer entirely.
        if (v.currentTime < sb.buffered.start(0)) v.currentTime = sb.buffered.start(0);

        const realGap = (end - v.currentTime) / ratio;

        // Big backlogs need a jump, not a nudge. Leaving a tab hidden pauses
        // playback while data keeps arriving, and coming back 20s behind would
        // take over a minute to drain at the gentle rate below. A seek is safe
        // here: the keyframe interval is ~1s, so anything a couple of seconds
        // inside the buffer lands on a decodable point. (This is only true
        // because the interval is short -- seeking to the live *edge* still
        // isn't reliable, and isn't what this does.)
        if (realGap > bufferSeconds * 3 && now - lastResync > 5) {
          lastResync = now;
          v.currentTime = end - Math.min(bufferSeconds * 0.5, 2) * ratio;
          return;
        }

        // --- play at the rate media is actually arriving, plus a nudge to
        // settle on TARGET seconds of latency ---
        const trim = Math.max(-0.15, Math.min(0.25, (realGap - TARGET) * 0.15));
        const rate = Math.max(0.5, Math.min(20, ratio * (1 + trim)));
        if (Math.abs(v.playbackRate - rate) > 0.02) v.playbackRate = rate;
      });

      const buf = new Uint8Array(4 * 1024 * 1024);
      let bufLen = 0;

      this.ondata = data => {
        if (sb.updating || bufLen > 0) {
          const b = new Uint8Array(data);
          if (bufLen + b.byteLength > buf.length) return;   // drop rather than overflow
          buf.set(b, bufLen);
          bufLen += b.byteLength;
        } else {
          try {
            sb.appendBuffer(data);
          } catch (e) { /* as above */ }
        }
      };
    };
  }

  onconnect() {
    const started = super.onconnect();
    if (started && this.pcState === WebSocket.CLOSED) reportConnecting(this.recovering);
    return started;
  }

  onopen() {
    const result = super.onopen();
    this.onmessage['ui'] = msg => {
      if (msg.type === 'error') setState('error');
      else if (['mse', 'mp4', 'hls', 'mjpeg'].includes(msg.type)) {
        this.recovering = false;
        setState('live', msg.type.toUpperCase());
      }
    };
    return result;
  }

  onpcvideo(ev) {
    super.onpcvideo(ev);
    this.recovering = false;
    if (this.pcState !== WebSocket.CLOSED) setState('live', 'WebRTC');
  }

  onclose() {
    // When WebRTC wins the race the player deliberately closes the WebSocket
    // (it sets pcState = OPEN first, then drops the socket). That is a
    // successful handover, not a disconnect, so don't report it as one.
    if (this.pcState === WebSocket.CLOSED) reportConnecting(this.recovering);
    return super.onclose();
  }
}
customElements.define('printer-cam', PrinterCam);

const cam = document.getElementById('cam');
cam.mode = mode;
cam.media = 'video';                 // the K2 camera has no audio track
cam.background = false;              // hidden tab => disconnect => 0% CPU on the host
cam.src = new URL('api/ws?src=' + encodeURIComponent(src), location.href);

// --- controls --------------------------------------------------------
document.getElementById('btn-full').onclick = () =>
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();

document.getElementById('btn-reload').onclick = () => {
  setState('connecting');
  cam.ondisconnect();
  setTimeout(() => cam.onconnect(), 200);
};

// Snapshot is taken from the already-decoded frame in the browser, so it
// costs the server nothing (unlike go2rtc's /api/frame.jpeg, which does a
// full decode + JPEG encode per call).
document.getElementById('btn-snap').onclick = () => {
  const v = cam.video;
  if (!v || !v.videoWidth) return;
  const canvas = document.createElement('canvas');
  canvas.width = v.videoWidth;
  canvas.height = Math.round(v.videoWidth / aspect);
  // Same reason as `aspect` above: scale the decoded frame back to the real
  // geometry rather than the stretched intrinsic size.
  canvas.getContext('2d').drawImage(v, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${src}-${new Date().toISOString().replace(/[:.]/g, '-')}.jpg`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }, 'image/jpeg', 0.92);
};

// --- keep the video box at the stream's true aspect ratio ------------
const frame = document.getElementById('frame');
function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  let w = vw, h = vw / aspect;
  if (h > vh) { h = vh; w = vh * aspect; }
  frame.style.width = Math.round(w) + 'px';
  frame.style.height = Math.round(h) + 'px';
}
addEventListener('resize', layout);
addEventListener('orientationchange', layout);
layout();

// --- print progress --------------------------------------------------
// Served by the front door at /print, which asks Moonraker and hands back only
// progress, elapsed and filament used. Moonraker itself is never reachable
// from the browser: it has no CORS headers, and its API can control the printer.
const printBar = document.getElementById('print');
const printInner = document.getElementById('print-inner');
const el = {
  pct:     document.getElementById('print-pct'),
  state:   document.getElementById('print-state'),
  elapsed: document.getElementById('print-elapsed'),
  fil:     document.getElementById('print-fil'),
  swatch:  document.getElementById('print-swatch'),
  filType: document.getElementById('print-fil-type'),
  fill:    document.getElementById('print-fill'),
};

/**
 * 4h07m12s / 12m30s / 45s -- no leading zero units.
 *
 * Seconds are kept even past the hour. This is only ever used for elapsed
 * time, which is exact rather than estimated, so there is no false precision
 * in it -- and dropping them would leave the figure sitting still for a minute
 * at a time on exactly the long prints where a live clock is worth having.
 */
function duration(sec) {
  if (sec === null || sec === undefined || !isFinite(sec)) return '\u2014';
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const ss = String(s).padStart(2, '0');
  if (h) return `${h}h${String(m).padStart(2, '0')}m${ss}s`;
  if (m) return `${m}m${ss}s`;
  return `${s}s`;
}

// How the fascia stays live between polls. /print is polled every three
// seconds, which unaided makes the clock jump in three-second steps and the
// bar hop -- the numbers read as a stale snapshot rather than a running job.
//
// The two kinds of figure get different treatment, because they deserve
// different confidence:
//
//   elapsed    is wall-clock time and extrapolates exactly: the polled value
//              plus how long ago it was polled. Held still while paused,
//              because Klipper's own print_duration stops then too.
//   progress,  are interpolated *towards* the last polled value and never
//   filament   past it. Extrapolating those would mean inventing an extrusion
//              rate, and a running total that overshoots and then walks
//              backwards reads as a bug rather than as precision. This costs
//              up to one poll of lag and never shows a figure that was not
//              genuinely true.
//
// requestAnimationFrame is the right clock for this: it stops on its own in a
// background tab, so a hidden viewer costs nothing.
const EASE_MS = 3000;          // one poll interval
const stillFrame = matchMedia('(prefers-reduced-motion: reduce)');

let fascia = null;             // latest reading + what is currently on screen
let fasciaRAF = 0;

/** Write only on change; this runs up to 60x a second. */
function put(node, text) {
  if (node.textContent !== text) node.textContent = text;
}

function paintFascia(now) {
  fasciaRAF = 0;
  if (!fascia) return;
  const f = fascia;

  const age = (now - f.polledAt) / 1000;
  put(el.elapsed, duration(f.elapsed + (f.paused ? 0 : age)));

  // Linear towards the reading, clamped at it. Linear rather than eased
  // because these quantities genuinely advance at a steady rate: with regular
  // polls the display arrives at reading N just as N+1 lands, so the velocity
  // is continuous. An ease-out instead decelerates to a stop and then jerks
  // forward on each poll -- a visible pulse every three seconds.
  const e = stillFrame.matches ? 1 : Math.min(1, (now - f.polledAt) / EASE_MS);

  const progress = f.from.progress + (f.progress - f.from.progress) * e;
  put(el.pct, String(Math.round(progress * 100)));
  const w = (progress * 100).toFixed(2) + '%';
  if (el.fill.style.width !== w) el.fill.style.width = w;

  let metres = null;
  if (f.metres == null) {
    put(el.fil, '\u2014');
  } else {
    metres = f.from.metres + (f.metres - f.from.metres) * e;
    // Grams follow from the server's own grams-per-metre rather than being
    // eased separately, so the two figures never disagree with each other.
    put(el.fil, metres.toFixed(2) + ' m' +
      (f.gPerM != null ? ` \u00b7 ${(metres * f.gPerM).toFixed(0)} g` : ''));
  }

  f.shown = { progress, metres };
  fasciaRAF = requestAnimationFrame(paintFascia);
}

function showPrint(d) {
  printBar.hidden = false;
  // hidden -> shown needs a frame in between, or the transition doesn't run
  requestAnimationFrame(() => printBar.classList.add('show'));
  document.body.classList.add('printing');
  printInner.classList.toggle('paused', !!d.paused);

  el.state.textContent = d.paused ? 'paused' : '';

  // Carry on from whatever is on screen, so a new reading never snaps.
  const shown = fascia && fascia.shown;
  fascia = {
    polledAt: performance.now(),
    elapsed:  d.elapsed_s ?? 0,
    paused:   !!d.paused,
    progress: d.progress ?? 0,
    metres:   d.filament_m ?? null,
    // Metres are exact. Grams appear when the density is known -- which it
    // usually is, because the printer reports the filament type over
    // Creality's websocket (see web/print_status.py).
    gPerM: (d.filament_g != null && d.filament_m > 0) ? d.filament_g / d.filament_m : null,
    from: {
      progress: shown ? shown.progress : (d.progress ?? 0),
      metres:   shown && shown.metres != null ? shown.metres : (d.filament_m ?? 0),
    },
  };
  fascia.shown = { progress: fascia.from.progress, metres: fascia.from.metres };
  if (!fasciaRAF) fasciaRAF = requestAnimationFrame(paintFascia);

  // Filament type and its actual colour, when the printer knows them.
  el.filType.textContent = d.filament_type || '';
  el.filType.title = d.filament_name || '';
  if (d.filament_color) {
    el.swatch.style.background = d.filament_color;
    el.swatch.classList.add('show');
    el.swatch.title = [d.filament_name, d.filament_color].filter(Boolean).join(' ');
  } else {
    el.swatch.classList.remove('show');
  }
}

function hidePrint() {
  fascia = null;
  cancelAnimationFrame(fasciaRAF);
  fasciaRAF = 0;
  printBar.classList.remove('show');
  document.body.classList.remove('printing');
  // wait out the fade before removing it from layout
  setTimeout(() => { if (!printBar.classList.contains('show')) printBar.hidden = true; }, 400);
}

async function pollPrint() {
  try {
    const r = await fetch('print', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (d.printing) showPrint(d); else hidePrint();
  } catch (e) {
    // No front door (go2rtc reached directly), or the printer is unreachable.
    // Either way there is nothing to show, so the bar just stays away.
    hidePrint();
  }
}
pollPrint();
setInterval(() => { if (!document.hidden) pollPrint(); }, 3000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollPrint(); });

// --- auto-hide chrome ------------------------------------------------
let idleTimer;
const wake = () => {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
};
['mousemove', 'touchstart', 'keydown'].forEach(e => addEventListener(e, wake, { passive: true }));
wake();
</script>
</body>
