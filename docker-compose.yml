services:
  printer-cam:
    # Prebuilt by .github/workflows/publish-image.yml. Deliberately NOT a
    # `build:` -- Portainer cannot build a stack when its environment is
    # connected through the Portainer Agent (the agent does not proxy
    # BuildKit's gRPC session, so the build fails with "failed to list
    # workers ... http2: frame too large"). Pulling an image sidesteps that
    # entirely, and means this file also works in Portainer's web editor.
    #
    # To build it yourself instead:
    #   docker build -t printer-cam:local .
    # then change the line below to `image: printer-cam:local`.
    image: ghcr.io/pakkid/printer-cam:latest
    container_name: printer-cam
    restart: unless-stopped

    # These are read by go2rtc itself at startup (see config/go2rtc.yaml).
    # Change one here -- or in .env, or in Portainer's stack Environment
    # variables -- and redeploy; there is nothing to edit inside the image.
    environment:
      # LAN address of the Creality K2 / K2 Plus.
      PRINTER_IP: ${PRINTER_IP:-192.168.1.17}

      # HTTP basic auth for the viewer. Leave AUTH_USER empty to disable it
      # (e.g. if the tunnel in front already authenticates).
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASS: ${AUTH_PASS:-}

      # Set to <docker-host-lan-ip>:8555 for real-time WebRTC playback.
      # Without it go2rtc can only advertise the container's internal 172.x
      # address, which no browser can reach, and viewers fall back to MSE
      # (~0.6s behind live instead of real-time). Empty is harmless.
      WEBRTC_CANDIDATE: ${WEBRTC_CANDIDATE:-}

    command:
      - go2rtc
      - -config=/config/go2rtc.yaml
      # LOG_LEVEL is deliberately applied here rather than as a ${...} inside
      # go2rtc.yaml: go2rtc treats substituted values as secrets and drops any
      # log line containing them, and the level string appears in every line.
      # Docker Compose substitutes this before the container starts instead.
      - -config={"log":{"level":"${LOG_LEVEL:-info}"}}

    ports:
      # Viewer + WebSocket stream. This is the only port a tunnel needs.
      - "${HTTP_PORT:-1984}:1984"

      # WebRTC. Only actually used once WEBRTC_CANDIDATE is set, but harmless
      # to publish either way.
      - "8555:8555/tcp"
      - "8555:8555/udp"

    # go2rtc is a single static Go binary that only re-muxes H.264 here.
    # This ceiling is far above what it actually uses (~15-25 MB).
    mem_limit: 256m

    healthcheck:
      # A 401 still proves the HTTP server is alive, and with local_auth: true
      # even the loopback healthcheck gets one when a password is configured.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:1984/ || wget -O /dev/null http://127.0.0.1:1984/ 2>&1 | grep -q 401"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Alternative to setting WEBRTC_CANDIDATE: host networking lets go2rtc
    # discover the host's own LAN address, so WebRTC works with no extra
    # config. Comment out the `ports:` block above if you use this.
    #network_mode: host

    # Uncomment to put your tunnel container on the same network, so it can
    # reach this service as http://printer-cam:1984 with no published port.
    #networks: [tunnel]

#networks:
#  tunnel:
#    external: true
